services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: memforge-postgres
    environment:
      POSTGRES_USER: memforge
      POSTGRES_PASSWORD: memforge
      POSTGRES_DB: memforge
    ports:
      - "55432:5432"
    volumes:
      - memforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memforge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  memforge_pgdata: